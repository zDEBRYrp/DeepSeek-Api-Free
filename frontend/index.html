<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Bridge UI</title>
<style>
  :root { color-scheme: dark; --bg:#1a1b1e; --panel:#242528; --text:#e8e8e8;
          --dim:#9a9aa0; --acc:#4c8dff; --think:#2c2a1e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:10px 14px;
           background:var(--panel); border-bottom:1px solid #333; flex-wrap:wrap; }
  header select, header input { background:#111; color:var(--text);
    border:1px solid #444; border-radius:6px; padding:6px 8px; }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:900px; padding:10px 12px; border-radius:10px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#2b4a7a; }
  .asst { align-self:flex-start; background:var(--panel); border:1px solid #38383d; }
  details.think { margin:0 0 8px; background:var(--think); border-radius:8px; padding:6px 10px; }
  details.think summary { cursor:pointer; color:var(--dim); font-size:12px; }
  .cites { font-size:12px; color:var(--dim); margin-top:8px; }
  .cites a { color:var(--acc); }
  #form { display:flex; gap:8px; padding:12px 14px; background:var(--panel); }
  #form input[type=text] { flex:1; padding:10px; border-radius:8px;
    border:1px solid #444; background:#111; color:var(--text); }
  #form button { padding:10px 18px; border-radius:8px; border:0;
    background:var(--acc); color:#fff; cursor:pointer; }
  #form button:disabled { opacity:.5; }
  label.chk { display:flex; gap:4px; align-items:center; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<header>
  <strong>DeepSeek Bridge</strong>
  <select id="model"><option>deepseek-chat</option></select>
  <label class="chk"><input type="checkbox" id="think">think</label>
  <label class="chk"><input type="checkbox" id="search">search</label>
  <input id="apikey" type="password" placeholder="API key (если задан)" size="18">
  <span id="status" style="color:var(--dim);font-size:12px"></span>
</header>
<div id="chat"></div>
<form id="form">
  <input id="q" type="text" placeholder="Сообщение…" autocomplete="off">
  <button id="send">➤</button>
</form>
<script>
const $ = id => document.getElementById(id);
const history = [];
const key = () => $('apikey').value || localStorage.getItem('dsb_key') || '';
$('apikey').addEventListener('change', e => localStorage.setItem('dsb_key', e.target.value));
$('apikey').value = localStorage.getItem('dsb_key') || '';

fetch('v1/models').then(r => r.json()).then(j => {
  $('model').innerHTML = j.data.map(m =>
    `<option value="${m.id}">${m.display_name || m.id}</option>`).join('');
}).catch(() => {});

function add(cls, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.innerHTML = html;
  $('chat').appendChild(d); $('chat').scrollTop = 1e9; return d;
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  $('q').value = ''; $('send').disabled = true;
  add('user', esc(q));
  history.push({role:'user', content:q});
  const box = add('asst', '<span style="color:var(--dim)">…</span>');
  let think = '', thinkBody = null, text = '', textDiv = null, cites = [];
  const ensureThink = () => {
    if (thinkBody) return;
    box.innerHTML = '';
    const det = document.createElement('details');
    det.className = 'think'; det.open = true;
    det.innerHTML = '<summary>мышление</summary>';
    thinkBody = document.createElement('div');
    det.appendChild(thinkBody); box.appendChild(det);
    textDiv = document.createElement('div'); box.appendChild(textDiv);
  };
  const ensureText = () => {
    if (textDiv) return;
    if (!thinkBody) box.innerHTML = '';
    textDiv = document.createElement('div'); box.appendChild(textDiv);
  };
  try {
    const headers = {'Content-Type':'application/json'};
    if (key()) headers['Authorization'] = 'Bearer ' + key();
    const res = await fetch('v1/chat/completions', {method:'POST', headers,
      body: JSON.stringify({model:$('model').value, messages:history,
        stream:true, deep_think:$('think').checked, search:$('search').checked})});
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const line = p.trim(); if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        let ev; try { ev = JSON.parse(payload); } catch { continue; }
        if (ev.error) { text += '\n⚠️ ' + ev.error.message; continue; }
        const ch = (ev.choices || [])[0] || {}, d = ch.delta || {};
        if (d.reasoning_content) {
          think += d.reasoning_content;
          ensureThink(); thinkBody.textContent = think;
        }
        if (d.content) { text += d.content; ensureText(); textDiv.textContent = text; }
        if (ev.citations && ev.citations.length) cites = ev.citations;
        if (cites.length && !box.querySelector('.cites'))
          box.insertAdjacentHTML('beforeend', '<div class="cites">Источники:<br>' +
            cites.map(c => `<a href="${c.url}" target="_blank">${esc(c.title || c.url)}</a>`).join('<br>') + '</div>');
        $('chat').scrollTop = 1e9;
      }
    }
    history.push({role:'assistant', content:text});
    $('status').textContent = '';
  } catch (err) { box.textContent = '⚠️ ' + err; }
  $('send').disabled = false;
});
</script>
</body>
</html>
